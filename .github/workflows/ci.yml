name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned on purpose. `moon fmt` output depends on the toolchain version: newer
  # releases spell the default `Int` as its concrete width for the wasm-gc
  # target, so an unpinned CI disagrees with a local checkout using an older
  # toolchain and `moon fmt --check` fails without any code being wrong.
  MOONBIT_INSTALL_VERSION: 0.1.20260915

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Check
        run: moon check --target all
      - name: Test (wasm-gc)
        run: moon test --target wasm-gc
      - name: Format
        run: moon fmt --check