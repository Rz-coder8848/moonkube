name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Check
        run: moon check --target all
      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

# `moon fmt --check` is deliberately not a CI gate. Its output depends on the
# toolchain release: newer versions spell the default `Int` as its concrete
# width for the wasm-gc target, older ones spell it `Int`, and old toolchain
# builds are removed from the download server. Pinning the release is therefore
# both fragile and eventually impossible, so formatting is enforced locally by
# .githooks/pre-commit instead of gating the build on a version-specific diff.